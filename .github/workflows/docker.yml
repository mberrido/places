# Check, then build the Docker image and push it to GitHub Container Registry.
# Watchtower on the NAS pulls ghcr.io/mberrido/places:latest when it changes.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'deploy/**', '.env.example']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          # DS920+ is Intel (amd64).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ask Watchtower on the NAS to pull the new image and restart Places.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
      TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
    steps:
      - name: Trigger Watchtower
        run: |
          if [ -z "$TOKEN" ] || [ -z "$WATCHTOWER_URL" ]; then echo "::warning::WATCHTOWER_TOKEN / WATCHTOWER_URL not set — skipping deploy"; exit 0; fi
          curl -fsS -m 300 -H "Authorization: Bearer $TOKEN" "$WATCHTOWER_URL/v1/update?image=${IMAGE}"
          echo "Watchtower updated ${IMAGE} to ${GITHUB_SHA::7}"
