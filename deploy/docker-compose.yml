# Compose file for the NAS: runs the prebuilt image from GitHub Container Registry.
# Put it in /volume1/docker/places next to your .env. Watchtower keeps it updated.
services:
  places:
    image: ghcr.io/mberrido/places:latest
    container_name: places
    restart: unless-stopped
    # Run as the DSM user that owns the data and backup folders (set PUID/PGID in .env).
    user: "${PUID:-1026}:${PGID:-100}"
    env_file: .env
    environment:
      TZ: Europe/London
      DATABASE_PATH: /data/places.db
      BACKUP_DIR: /backups
    ports:
      # Localhost only: reach it through DSM's reverse proxy (HTTPS). Don't forward 8421 on the router.
      - "127.0.0.1:8421:8421"
    volumes:
      - /volume1/docker/places/data:/data
      # Nightly database snapshots.
      - /volume1/docker/places/backups:/backups
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - places
    labels:
      - com.centurylinklabs.watchtower.enable=true   # needed if Watchtower runs with --label-enable

networks:
  places:
    ipam:
      config:
        - subnet: 172.30.85.0/24
          gateway: 172.30.85.1
